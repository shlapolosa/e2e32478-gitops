apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: e2e32478-app
  namespace: default
spec:
  components:
  - name: e2e32478
    type: webservice
    properties:
      image: docker.io/socrates12345/e2e32478:a441c03
      port: 8080
      healthPath: "/health"
      language: python
      framework: fastapi
      database: postgres
      envFrom:
      - secretRef:
          name: "e2e32478-db-secret"
      environment:
        LOG_LEVEL: "INFO"
        AGENT_TYPE: "e2e32478"
  policies:
  - name: deploy-to-vcluster
    type: topology
    properties:
      clusters: ["host"]
      namespace: "default"
